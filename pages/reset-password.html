{% extends "base.html" %}

{% block content %}
  <section class="section login-section">
    <div class="container">
      <div class="card login-card">
        <p class="eyebrow">Sécurité du compte</p>
        <h1>Nouveau mot de passe</h1>
        <p>Choisis un mot de passe d’au moins 8 caractères.</p>
        <form class="form-stack" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <label><span>Nouveau mot de passe</span><input type="password" name="password" autocomplete="new-password" minlength="8" required autofocus></label>
          <label><span>Confirmer le mot de passe</span><input type="password" name="password_confirmation" autocomplete="new-password" minlength="8" required></label>
          <button class="button button-primary" type="submit">Réinitialiser mon mot de passe</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
