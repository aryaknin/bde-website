{% extends "base.html" %}

{% block content %}
  <section class="section login-section">
    <div class="container">
      <div class="card login-card">
        <p class="eyebrow">Accès au compte</p>
        <h1>Mot de passe oublié</h1>
        <p>Indique l’adresse e-mail liée à ton compte. Si elle existe, tu recevras un lien valable 30 minutes.</p>
        <form class="form-stack" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <label><span>Adresse e-mail</span><input type="email" name="email" autocomplete="email" required autofocus></label>
          <button class="button button-primary" type="submit">Envoyer le lien</button>
        </form>
        <a class="text-link" href="{{ url_for('login') }}">Retour à la connexion →</a>
      </div>
    </div>
  </section>
{% endblock %}
